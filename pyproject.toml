[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "voc-olist"
version = "0.1.0"
description = "Voice of Customer com RAG e evidências nas avaliações Olist"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "sentence-transformers>=3.4,<7",
  "streamlit>=1.40,<2",
  "python-dotenv>=1.0,<2",
  "transformers>=4.45,<6",
  "torch>=2.6,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
voc-olist = "voc_olist.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
